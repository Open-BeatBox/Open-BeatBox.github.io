name: Deploy BEATBox website and documentation

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/build-docs.ps1"
      - "package.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build Sphinx manual
        run: python -m sphinx -b html -d docs/_build/doctrees docs/source site/public/docs/manual

      - name: Build static site
        env:
          NEXT_PUBLIC_SITE_URL: https://open-beatbox.github.io
        run: npm run build
        working-directory: site

      - name: Ensure nojekyll
        run: touch site/out/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/out
          publish_branch: gh-pages
